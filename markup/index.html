<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Список задач</title>
</head>
<body>
    <header> 
        <h1>Список задач</h1>
    </header>
	<main> 
        <div class="new-task-panel">
            <h2>Новая задача</h2> 
            <form>
                <input type="text" placeholder="Название задачи...">
                <button type="submit" class="add-button"><b>+</b> Добавить</button>
            </form> 
        </div>
        <div class="task-board">
            <div class="backlog-tasks">
                <div class="task-type">Бэклог</div>
                <ul class="task-list">
                    <li>Выучить JS</li>
                    <li>Выучить React</li>
                    <li>Сделать домашку</li>
                </ul>
            </div>
            <div class="processing-tasks">
                <div class="task-type">В процессе</div>
                <ul class="task-list">
                    <li>Выпить смузи</li>
                    <li>Попить воды</li>
                </ul>
            </div>
            <div class="done-tasks">
                <div class="task-type">Готово</div>
                <ul class="task-list">
                    <li>Позвонить маме</li>
                    <li>Погладить кота</li>
                </ul>
            </div>
            <div class="bin">
                <div class="task-type">Корзина</div>
                <ul class="task-list">
                    <li>Сходить погулять</li>
                    <li>Прочитать Войну и Мир</li>
                </ul>
                <button type="button" class="clear-button"><b>×</b> Очистить</button>
            </div>
        </div>
    </main>
</body>
</html>
